# The Go quality gate. Run with `mooncake task <name>`.
# List all tasks: `mooncake task`.
#
# Host/server provisioning is NOT here — it lives in the dotfiles repo
# (~/dotfiles/components/moongit), applied with `mooncake apply -c
# ~/dotfiles/main_pc.yml -t moongit`.
#
# The dev-loop tasks (build/install/deploy/backup/gc/restore/uninstall/
# create-repo/run/ui/clean/ci-images/agent-image) moved to tasks/
# (provision) — see docs/ops-provisioning.md and moongit issue #410. The
# web/ quality gate (ts-quality) moved there too, in the same pass that
# picked up ts-quality's provision-migration rewrite (upstream dropped
# mooncake-module compatibility outright — see docs/ops-provisioning.md's
# "Quality gate — ts-quality" section). This file now holds only the
# goq-backed Go quality-gate tasks, plus `tidy`, which #410 didn't scope
# out. The CI runner (mgitci.yml, cmd/moongitd/ci_runner.go) still execs
# `mooncake task ci` for the Go gate in-container — tracked separately in
# #411 as explicitly deferred; the `web` CI job now runs the provision-native
# ts-quality gate instead (tasks/ui-ci.yml).

version: "1.0"

# The Go quality gate (lint/vuln/scan/ai-lint/arch-snapshot/budget-status/dupl
# + the fast/full CI gates) comes from the shared **go-quality** module
# (alehatsman/go-quality), keeping moongit in lockstep with dex + mooncake.
# moongit has no build tags and no bespoke CI stages, so `ci` is just goq/ci.
#
# go-quality is fetched from github.com over https (alehatsman/go-quality), so
# no host trust or local moongit is needed — module resolution works on any
# machine, including a fresh PC while this moongit host is down. moongit keeps a
# mirror of the repo, but github is the source consumers pin.
# (first run clones to ~/.cache/mooncake/modules/...; later runs hit cache.)
#
# Project-specific lint excludes live in ./.golangci.yml (goq/lint runs
# golangci-lint in-repo so the local config is honored).
modules:
  goq: "github.com/alehatsman/go-quality@v0.1.2"

tasks:
  tidy:
    desc: Sync Go module dependencies
    steps:
      - cmd:
          argv: ["go", "mod", "tidy"]

  # ---- Go quality gate (via the go-quality module) ----------------------
  # Pure single-use wrappers collapse to the `use:` shorthand; `mooncake task`
  # lists each go-quality component's own description.
  test: goq/test

  vet: goq/vet

  fmt:
    desc: Format Go sources with gofmt -w (writer; goq/fmt is the ci-fast check)
    steps:
      - shell:
          cmd: "gofmt -w ."
      - log:
          msg: "code formatted"

  lint: goq/lint

  vuln: goq/vuln

  scan: goq/scan

  ai-lint: goq/ai-lint

  # Keeps the full form: a non-default prop (args) means it can't be a one-liner.
  ai-lint-all:
    desc: AI-smell sweep on every tracked Go file
    steps:
      - use: goq/ai-lint
        props:
          args: "--all"

  arch-snapshot: goq/arch-snapshot

  budget-status: goq/budget-status

  dupl: goq/dupl

  ci-fast: goq/ci-fast

  ci: goq/ci

  # ---- web quality gate — moved to tasks/ui-*.yml (provision) -----------
  # ts-quality's provision-migration rewrite dropped mooncake-module
  # compatibility (no more name:/version: keys), so it can no longer be
  # `use`d from here. Run `provision list tasks/` — ui-tools, ui-sync-config,
  # ui-config-check, ui-findings, ui-fast, ui-ci.
