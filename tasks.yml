# Imperative operations. Run with `mooncake task <name>`.
# List all tasks: `mooncake task`.
#
# Host/server provisioning is NOT here — it lives in the dotfiles repo
# (~/dotfiles/components/moongit), applied with `mooncake apply -c
# ~/dotfiles/main_pc.yml -t moongit`. This file holds the dev loop plus
# a few ops helpers that act on the installed location.

version: "1.0"

vars:
  # Match the install paths the dotfiles moongit component uses so
  # backup/restore/uninstall operate on the same locations the systemd
  # service uses.
  binary_path: "{{ home }}/.local/bin/moongitd"
  client_path: "{{ home }}/.local/bin/moongit"
  data_dir:    "{{ home }}/.local/share/moongit"
  unit_path:   "{{ home }}/.config/systemd/user/moongit.service"
  backup_dir:  "{{ home }}/.local/share/moongit/backups"

tasks:
  # ---- dev loop ---------------------------------------------------------
  tidy:
    desc: Sync Go module dependencies
    steps:
      - cmd:
          argv: ["go", "mod", "tidy"]

  build:
    desc: Build both binaries to ./bin/ (dev tree)
    steps:
      - file.write:
          path: bin
          state: directory
      - cmd:
          argv: ["go", "build", "-o", "bin/moongitd", "./cmd/moongitd"]
      - cmd:
          argv: ["go", "build", "-o", "bin/moongit", "./cmd/moongit"]

  install:
    desc: Build both binaries into ~/.local/bin + create mgitd/mgit aliases (no systemd changes)
    steps:
      - file.write:
          path: "{{ home }}/.local/bin"
          state: directory
      - cmd:
          argv: ["go", "build", "-o", "{{ binary_path }}", "./cmd/moongitd"]
      - cmd:
          argv: ["go", "build", "-o", "{{ client_path }}", "./cmd/moongit"]
      - file.write:
          path: "{{ home }}/.local/bin/mgitd"
          src: "{{ binary_path }}"
          state: link
      - file.write:
          path: "{{ home }}/.local/bin/mgit"
          src: "{{ client_path }}"
          state: link
      - log:
          msg: "installed moongitd + moongit to {{ home }}/.local/bin (aliases: mgitd, mgit)"

  deploy:
    # Fast dev-loop deploy of the CURRENT working tree — bypasses the
    # HEAD-gated `mooncake apply -t moongit` in dotfiles. Rebuilds both
    # binaries + the web UI (served from web/dist via MOONGIT_WEB_DIR),
    # reinstalls to ~/.local/bin, and restarts the live service. Does not
    # touch the .sha sidecar, so a later `apply` still reconciles to HEAD.
    desc: Rebuild daemon + client + web UI, reinstall to ~/.local/bin, restart moongit.service
    steps:
      - file.write:
          path: "{{ home }}/.local/bin"
          state: directory
      - cmd:
          argv: ["go", "build", "-trimpath", "-ldflags", "-s -w", "-o", "{{ binary_path }}", "./cmd/moongitd"]
      - cmd:
          argv: ["go", "build", "-trimpath", "-ldflags", "-s -w", "-o", "{{ client_path }}", "./cmd/moongit"]
      - file.write:
          path: "{{ home }}/.local/bin/mgitd"
          src: "{{ binary_path }}"
          state: link
      - file.write:
          path: "{{ home }}/.local/bin/mgit"
          src: "{{ client_path }}"
          state: link
      - shell:
          cmd: "npm install"
          creates: web/node_modules
        cwd: web
      - cmd:
          argv: ["npm", "run", "build"]
        cwd: web
      - shell:
          cmd: "systemctl --user restart moongit.service"
      - log:
          msg: "deployed: rebuilt + reinstalled binaries, rebuilt web UI, restarted moongit.service"

  test:
    desc: Run unit tests
    steps:
      - cmd:
          argv: ["go", "test", "./..."]

  run:
    desc: Run moongitd in the foreground against ./data/ (dev mode)
    steps:
      - file.write:
          path: data/repos
          state: directory
      - cmd:
          argv: ["go", "run", "./cmd/moongitd"]

  ui:
    desc: Start the Vite dev server on :5173 (proxies /api/* to the daemon on :8080)
    steps:
      - shell:
          cmd: "npm install"
          creates: web/node_modules
        cwd: web
      - cmd:
          argv: ["npm", "run", "dev"]
        cwd: web

  ui-build:
    desc: Build the UI for production into web/dist/
    steps:
      - shell:
          cmd: "npm install"
          creates: web/node_modules
        cwd: web
      - cmd:
          argv: ["npm", "run", "build"]
        cwd: web

  ui-test-install:
    desc: One-time install of Playwright browser binaries (chromium ~150MB)
    steps:
      - shell:
          cmd: "npm install"
          creates: web/node_modules
        cwd: web
      - cmd:
          argv: ["npx", "playwright", "install", "chromium"]
        cwd: web

  ui-test:
    desc: Run Playwright E2E tests (auto-spawns Vite dev server, mocks /api/*)
    steps:
      - shell:
          cmd: "npm install"
          creates: web/node_modules
        cwd: web
      - cmd:
          argv: ["npx", "playwright", "test"]
        cwd: web

  clean:
    desc: Remove dev build artifacts (keeps ./data/)
    steps:
      - shell:
          cmd: "rm -rf bin"

  # ---- ops (work against the installed location) ------------------------
  create-repo:
    desc: 'Register and init a repo against the installed data dir. Pass --vars with {owner, name}'
    steps:
      - cmd:
          argv: ["{{ binary_path }}", "repo", "create", "{{ owner }}/{{ name }}"]
        env:
          MOONGIT_DATA_DIR: "{{ data_dir }}"

  backup:
    desc: Snapshot the SQLite DB + bare repos to a timestamped tarball
    steps:
      - file.write:
          path: "{{ backup_dir }}"
          state: directory
      - shell:
          cmd: |
            set -eu
            ts=$(date -u +%Y%m%dT%H%M%SZ)
            tmp=$(mktemp -d)
            trap "rm -rf $tmp" EXIT
            sqlite3 "{{ data_dir }}/moongit.db" ".backup '$tmp/moongit.db'"
            tar czf "{{ backup_dir }}/moongit-$ts.tar.gz" \
              -C "{{ data_dir }}" repos \
              -C "$tmp" moongit.db
            echo "wrote {{ backup_dir }}/moongit-$ts.tar.gz"

  gc:
    desc: Repack + prune every bare repo under the data dir (reclaims loose objects from a long-running fleet)
    steps:
      - shell:
          cmd: |
            set -eu
            repos="{{ data_dir }}/repos"
            test -d "$repos" || { echo "no repos dir at $repos"; exit 0; }
            count=0
            # Bare repos live at repos/<owner>/<name>.git
            for d in "$repos"/*/*.git; do
              [ -d "$d" ] || continue
              echo "gc $d"
              git --git-dir="$d" gc --prune=now --quiet
              count=$((count + 1))
            done
            echo "gc complete: $count repo(s)"

  restore:
    desc: 'Restore from a backup tarball. Pass --vars with {tarball: /path/to/file.tar.gz}'
    steps:
      - shell:
          cmd: "systemctl --user stop moongit.service || true"
      - shell:
          cmd: |
            set -eu
            test -f "{{ tarball }}" || { echo "tarball not found: {{ tarball }}"; exit 1; }
            rm -rf "{{ data_dir }}/repos" "{{ data_dir }}/moongit.db"*
            tar xzf "{{ tarball }}" -C "{{ data_dir }}"
            echo "restored from {{ tarball }}"
      - shell:
          cmd: "systemctl --user start moongit.service || true"

  uninstall:
    desc: Reverse of `mooncake apply` — stop service, remove binaries + unit
    steps:
      - shell:
          cmd: "systemctl --user disable --now moongit.service || true"
      - shell:
          cmd: "rm -f {{ unit_path }} {{ binary_path }} {{ client_path }}"
      - shell:
          cmd: "systemctl --user daemon-reload"
      - log:
          msg: "moongit uninstalled (data dir {{ data_dir }} preserved)"
