# dex indexing config for the Go root. Indexing is opt-in: only paths
# matching an include pattern below are indexed; everything else (build
# output, data/, vendored assets) is skipped. Patterns use gitignore
# grammar — a trailing slash matches a directory subtree, `*.md` matches
# at any depth.
#
# The web/ TS frontend is indexed as its own dex root (web/.dex/config.toml)
# so the Go (go/types) and TS (tree-sitter) graphs stay separate. It is
# excluded here so this root's index/graph is pure Go.
[index]
include = [
  "cmd/",      # Go entrypoints (moongitd, mgit, …)
  "internal/", # Go server/packages
  "*.md",      # README, CLAUDE, VISION, …
  "tasks.yml",
  "go.mod",
]

# Carve-outs within the included trees (same grammar). Top-level dirs
# like bin/, data/, docs-working/ are already excluded by not being
# included above, so they need no entry here.
ignore = [
  "web/", # indexed separately as its own root — see web/.dex/config.toml
]
