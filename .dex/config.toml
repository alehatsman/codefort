# dex indexing config. Indexing is opt-in: only paths matching an
# include pattern below are indexed; everything else (build output,
# data/, vendored assets) is skipped. Patterns use gitignore grammar —
# a trailing slash matches a directory subtree, `*.md` matches at any
# depth.
[index]
include = [
  "cmd/",      # Go entrypoints (moongitd, mgit, …)
  "internal/", # Go server/packages
  "web/",      # TS/TSX/CSS frontend (node_modules/dist auto-excluded)
  "*.md",      # README, CLAUDE, VISION, …
  "tasks.yml",
  "go.mod",
]

# Carve-outs within the included trees (same grammar). Top-level dirs
# like bin/, data/, docs-working/ are already excluded by not being
# included above, so they need no entry here. (Consolidated from the
# former root .dexignore; web/package-lock.json dropped — already in
# dex's built-in DefaultPatterns.)
ignore = [
  "web/test-results/",      # Playwright run output — regenerated, stale UI snapshots
  "web/playwright-report/", # Playwright HTML report — regenerated noise
]
