description: "reverse of `provision apply tasks/install.yml` — stop service, remove binaries + unit"

steps:
  # vars_file loads values raw (unrendered) — a `{{ home }}`-containing
  # value from a file never gets a second render pass (provision spec
  # §3.3). An inline `vars:` step's values ARE rendered, so home-anchored
  # paths live here, not in a shared vars_file (confirmed with Provision
  # master mind, codefort issue #410).
  - vars:
      unit_path: "{{ home }}/.config/systemd/user/codefort.service"
      binary_path: "{{ home }}/.local/bin/codefortd"
      client_path: "{{ home }}/.local/bin/codefort"
      data_dir: "{{ home }}/.local/share/codefort"

  - name: disable + stop service
    shell: systemctl --user disable --now codefort.service || true
    changed_when: "false"

  - name: remove unit + binaries
    shell: "rm -f {{ unit_path }} {{ binary_path }} {{ client_path }}"
    changed_when: "false"

  - name: daemon-reload
    shell: systemctl --user daemon-reload
    changed_when: "false"

  - name: done
    shell: echo "codefort uninstalled (data dir {{ data_dir }} preserved)"
    changed_when: "false"
