description: repack + prune every bare repo under the data dir (reclaims loose objects from a long-running fleet)

steps:
  # vars_file loads values raw (unrendered) — a `{{ home }}`-containing
  # value from a file never gets a second render pass (provision spec
  # §3.3). An inline `vars:` step's values ARE rendered, so home-anchored
  # paths live here, not in a shared vars_file (confirmed with Provision
  # master mind, moongit issue #410).
  - vars:
      data_dir: "{{ home }}/.local/share/moongit"

  - name: gc all repos
    shell: |
      set -eu
      repos="{{ data_dir }}/repos"
      test -d "$repos" || { echo "no repos dir at $repos"; exit 0; }
      count=0
      # Bare repos live at repos/<owner>/<name>.git
      for d in "$repos"/*/*.git; do
        [ -d "$d" ] || continue
        echo "gc $d"
        git --git-dir="$d" gc --prune=now --quiet
        count=$((count + 1))
      done
      echo "gc complete: $count repo(s)"
    changed_when: "false"
