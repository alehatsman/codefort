description: full pre-push web gate — biome, typecheck, config drift, build, test, supply-chain posture, npm audit, ai-lint over tracked files, soft caps

# tq/ci. The checkout is tasks/ui-tools.yml's job and the pin lives there.
# Every prop tq/ci declares already defaults to what web/ wants, so there is
# nothing to pass beyond dir.
steps:
  - name: full gate
    use: "{{ home }}/.cache/provision/tools/ts-quality/ci.yml"
    props: { dir: web }
