description: build both binaries into ~/.local/bin + create mgitd/mgit aliases (no systemd changes)

steps:
  - vars_file: ./vars.yml

  - name: "~/.local/bin directory"
    file: { path: "{{ home }}/.local/bin", state: dir }

  - name: build moongitd
    cmd: [go, build, -o, "{{ binary_path }}", ./cmd/moongitd]
    changed_when: "false"

  - name: build moongit
    cmd: [go, build, -o, "{{ client_path }}", ./cmd/moongit]
    changed_when: "false"

  - name: mgitd alias
    file: { path: "{{ home }}/.local/bin/mgitd", src: "{{ binary_path }}", state: link }

  - name: mgit alias
    file: { path: "{{ home }}/.local/bin/mgit", src: "{{ client_path }}", state: link }

  - name: done
    shell: 'echo "installed moongitd + moongit to {{ home }}/.local/bin (aliases: mgitd, mgit)"'
    changed_when: "false"
