description: build both binaries into ~/.local/bin + create mgitd/mgit aliases (no systemd changes)

steps:
  # vars_file loads values raw (unrendered) — a `{{ home }}`-containing
  # value from a file never gets a second render pass (provision spec
  # §3.3). An inline `vars:` step's values ARE rendered, so home-anchored
  # paths live here, not in a shared vars_file (confirmed with Provision
  # master mind, moongit issue #410).
  - vars:
      binary_path: "{{ home }}/.local/bin/moongitd"
      client_path: "{{ home }}/.local/bin/moongit"

  - name: "~/.local/bin directory"
    file: { path: "{{ home }}/.local/bin", state: dir }

  - name: build moongitd
    cmd: [go, build, -o, "{{ binary_path }}", ./cmd/codefortd]
    changed_when: "false"

  - name: build moongit
    cmd: [go, build, -o, "{{ client_path }}", ./cmd/cf]
    changed_when: "false"

  - name: mgitd alias
    file: { path: "{{ home }}/.local/bin/mgitd", src: "{{ binary_path }}", state: link }

  - name: mgit alias
    file: { path: "{{ home }}/.local/bin/mgit", src: "{{ client_path }}", state: link }

  - name: done
    shell: 'echo "installed moongitd + moongit to {{ home }}/.local/bin (aliases: mgitd, mgit)"'
    changed_when: "false"
