description: build both binaries to ./bin/ (dev tree)

steps:
  - name: bin directory
    file: { path: bin, state: dir }

  - name: build moongitd
    cmd: [go, build, -o, bin/moongitd, ./cmd/moongitd]
    changed_when: "false"

  - name: build moongit
    cmd: [go, build, -o, bin/moongit, ./cmd/moongit]
    changed_when: "false"
