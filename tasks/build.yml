description: build both binaries to ./bin/ (dev tree)

steps:
  - name: bin directory
    file: { path: bin, state: dir }

  - name: build codefortd
    cmd: [go, build, -o, bin/codefortd, ./cmd/codefortd]
    changed_when: "false"

  - name: build codefort
    cmd: [go, build, -o, bin/codefort, ./cmd/cf]
    changed_when: "false"
