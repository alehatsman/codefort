# smoke: a host-mode (no image) cron job that hits the live prod server
# every 5 minutes. No container spin-up — mooncake steps run directly on
# the CI host, which IS the prod server, so 127.0.0.1:8080 is always local.
# Checks: /healthz (no auth), SPA root, and three API endpoints (Bearer token
# from MOONGIT_TOKEN in the service env — mint via: mgit token create smoke-ci).
# A failed assertion fails the step; mooncake aborts on the first failure.
#
# moongit CI — moongit's own pipeline (dogfooding the moongitci stack).
#
# Schema: version "1", jobs wired into a DAG via `needs`; `run:` is sugar for a
# mooncake shell step. Every job runs in a throwaway container off `image:`
# (see ci/Dockerfile.dev — the toolchain image carrying go + node + mooncake +
# the static-analysis tools the gate needs).
#
# DAG:  quality      web        (two independent roots)
#          \           /
#         build-images            (main only — runs after both gates pass)
#
# `quality` runs the full Go gate via the shared go-quality module
# (`mooncake task ci` → goq/ci; see tasks.yml). For the in-container mooncake to
# fetch that module from this moongit over http, three things line up:
#   1. ci/Dockerfile.dev bakes golangci-lint/govulncheck/gocyclo/dupl + an M3
#      mooncake (module insecure-host support) + python3.
#   2. the runner gives every CI container host reachability
#      (--add-host host.docker.internal:host-gateway, see ci_runner.go), so
#      host.docker.internal:8080 resolves to this moongit.
#   3. MOONCAKE_MODULE_INSECURE marks that host trusted for the http fetch.
# The CI checkout is now a real working tree with .git (ci_runner.go), which the
# gate's git-aware scripts (full.sh's `git rev-parse`) require.
#
# `build-images` rebuilds moongit-ci-dev:latest + moongit-agent:latest via the
# host Docker daemon (docker_socket: true mounts /var/run/docker.sock). Runs in
# parallel with deploy on main — both need quality + web to pass first.
#
# Deploy is intentionally NOT automated via CI. moongitd runs the pipeline —
# a self-deploy would interrupt the very run that triggered it. Deploy manually:
# `mooncake task deploy` or `mooncake apply -c ~/dotfiles/main_pc.yml -t moongit`.
version: "1"
on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    # Conventional-commit branch prefixes the fleet uses. Kept broad on
    # purpose: #199 makes this filter enforced (it was dead code before), so an
    # omitted prefix means that branch silently loses pre-merge CI. Add new
    # prefixes here rather than narrowing.
    branches:
      [
        main,
        "feat/*",
        "fix/*",
        "chore/*",
        "docs/*",
        "refactor/*",
        "test/*",
        "build/*",
        "ci/*",
        "perf/*",
      ]
jobs:
  quality:
    image: moongit-ci-dev:latest
    steps:
      - shell:
          cmd: mooncake task ci
        env:
          MOONCAKE_MODULE_INSECURE: host.docker.internal:8080

  web:
    image: moongit-ci-dev:latest
    steps:
      - run: cd web && npm ci && npm run build

  # build-images:
  #   image: moongit-ci-dev:latest
  #   docker_socket: true
  #   needs: [quality, web]
  #   steps:
  #     - shell:
  #         # Clone sibling repos from the moongit server (anonymous HTTP).
  #         # --vars overrides the default host paths that tasks.yml defaults to
  #         # ("{{ home }}/projects/..."), which don't exist inside the container.
  #         cmd: |
  #           set -eu
  #           git clone --depth=1 http://host.docker.internal:8080/alehatsman/mooncake.git /tmp/mooncake
  #           git clone --depth=1 http://host.docker.internal:8080/alehatsman/dex.git /tmp/dex
  #           printf '{"mooncake_src":"/tmp/mooncake"}' > /tmp/ci-vars.yml
  #           printf '{"mooncake_src":"/tmp/mooncake","dex_src":"/tmp/dex"}' > /tmp/agent-vars.yml
  #           mooncake task ci-images --vars /tmp/ci-vars.yml
  #           mooncake task agent-image --vars /tmp/agent-vars.yml
  #       env:
  #         MOONCAKE_MODULE_INSECURE: host.docker.internal:8080

  # smoke: host-mode (no image), runs on a cron schedule only.
  # Hits the live prod server at 127.0.0.1:8080 — no container needed.
  # Requires MOONGIT_TOKEN in the moongitd service env (moongit.secret.env).
  smoke:
    steps:
      - name: "healthz"
        assert:
          http:
            url: "http://127.0.0.1:8080/healthz"
            status: 200
            contains: "ok"

      - name: "SPA root"
        assert:
          http:
            url: "http://127.0.0.1:8080/"
            status: 200
            contains: "<div id=\"root\""

      - name: "API repos"
        assert:
          http:
            url: "http://127.0.0.1:8080/api/repos"
            status: 200
            headers:
              Authorization: "Bearer {{ env.MOONGIT_TOKEN }}"

      - name: "API issues"
        assert:
          http:
            url: "http://127.0.0.1:8080/api/issues"
            status: 200
            headers:
              Authorization: "Bearer {{ env.MOONGIT_TOKEN }}"

      - name: "API runs"
        assert:
          http:
            url: "http://127.0.0.1:8080/api/runs"
            status: 200
            headers:
              Authorization: "Bearer {{ env.MOONGIT_TOKEN }}"
