# moongit CI — moongit's own pipeline (dogfooding the moongitci stack).
#
# Schema: version "1", jobs wired into a DAG via `needs`; `run:` is sugar for a
# mooncake shell step. Every job runs in a throwaway container off `image:`
# (see ci/Dockerfile.dev — the toolchain image carrying go + node + mooncake +
# the static-analysis tools the gate needs).
#
# DAG:  quality      web        (two independent roots)
#          \           /
#           build-images (main only)
#
# `quality` runs the full Go gate via the shared go-quality module
# (`mooncake task ci` → goq/ci; see tasks.yml). For the in-container mooncake to
# fetch that module from this moongit over http, three things line up:
#   1. ci/Dockerfile.dev bakes golangci-lint/govulncheck/gocyclo/dupl + an M3
#      mooncake (module insecure-host support) + python3.
#   2. the runner gives every CI container host reachability
#      (--add-host host.docker.internal:host-gateway, see ci_runner.go), so
#      host.docker.internal:8080 resolves to this moongit.
#   3. MOONCAKE_MODULE_INSECURE marks that host trusted for the http fetch.
# The CI checkout is now a real working tree with .git (ci_runner.go), which the
# gate's git-aware scripts (full.sh's `git rev-parse`) require.
#
# `build-images` rebuilds moongit-ci-dev:latest + moongit-agent:latest via the
# host Docker daemon (docker_socket: true mounts /var/run/docker.sock). It only
# runs on main after quality + web pass — no point rebuilding images off a
# broken commit. Binaries baked into the agent image (mgit, dex, mooncake) are
# compiled from the CI checkout; `mooncake task agent-image` handles that via
# the agent-image task in tasks.yml.
version: "1"
on:
  push:
    # Conventional-commit branch prefixes the fleet uses. Kept broad on
    # purpose: #199 makes this filter enforced (it was dead code before), so an
    # omitted prefix means that branch silently loses pre-merge CI. Add new
    # prefixes here rather than narrowing.
    branches:
      [
        main,
        "feat/*",
        "fix/*",
        "chore/*",
        "docs/*",
        "refactor/*",
        "test/*",
        "build/*",
        "ci/*",
        "perf/*",
      ]
jobs:
  quality:
    image: moongit-ci-dev:latest
    steps:
      - shell:
          cmd: mooncake task ci
        env:
          MOONCAKE_MODULE_INSECURE: host.docker.internal:8080

  web:
    image: moongit-ci-dev:latest
    steps:
      - run: cd web && npm ci && npm run build

  build-images:
    image: moongit-ci-dev:latest
    docker_socket: true
    needs: [quality, web]
    steps:
      - shell:
          # Clone sibling repos from the moongit server (anonymous HTTP).
          # --vars overrides the default host paths that tasks.yml defaults to
          # ("{{ home }}/projects/..."), which don't exist inside the container.
          cmd: |
            set -eu
            git clone --depth=1 http://host.docker.internal:8080/alehatsman/mooncake.git /tmp/mooncake
            git clone --depth=1 http://host.docker.internal:8080/alehatsman/dex.git /tmp/dex
            mooncake task ci-images --vars '{"mooncake_src":"/tmp/mooncake"}'
            mooncake task agent-image --vars '{"mooncake_src":"/tmp/mooncake","dex_src":"/tmp/dex"}'
        env:
          MOONCAKE_MODULE_INSECURE: host.docker.internal:8080
