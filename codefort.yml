# smoke: a host-mode (no image) cron job that hits the live prod server
# every 5 minutes. No container spin-up — mooncake steps run directly on
# the CI host, which IS the prod server, so 127.0.0.1:8080 is always local.
# Checks: /healthz (no auth), SPA root, and three API endpoints (Bearer token
# from CODEFORT_TOKEN in the service env — mint via: mgit token create smoke-ci).
# A failed assertion fails the step; provision aborts on the first failure.
#
# moongit CI — moongit's own pipeline (dogfooding the moongitci stack).
#
# Schema: version "1", jobs wired into a DAG via `needs`; `run:` is sugar for a
# shell step. Every job runs in a throwaway container off `image:` (see
# ci/Dockerfile.dev — the toolchain image carrying go + node + provision +
# the static-analysis tools the gate needs). ci_runner.go translates each
# job's steps into one provision plan and execs `provision apply --json`
# inside the container (#411) — `run:`/raw `shell:`/raw `assert:{http:}` are
# mooncake's own authoring shapes, still what's written here, still what
# ci_runner.go translates from; only the exec target changed.
#
# DAG:  quality      web        (two independent roots)
#          \           /
#         build-images            (main only — runs after both gates pass)
#
# `quality` runs the full Go gate via the shared go-quality module
# (`mooncake task ci` → goq/ci; see tasks.yml). The module is fetched from
# github.com over https (tasks.yml pins github.com/alehatsman/go-quality), so the
# CI container only needs outbound internet — no host-gateway mapping or
# MOONCAKE_MODULE_INSECURE trust required. ci/Dockerfile.dev still bakes the
# static-analysis tools (golangci-lint/govulncheck/gocyclo/dupl) + python3.
# The CI checkout is now a real working tree with .git (ci_runner.go), which the
# gate's git-aware scripts (full.sh's `git rev-parse`) require.
#
# `web` runs the shared ts-quality gate (tasks/ui-tools.yml then
# tasks/ui-ci.yml — provision-native, unlike goq which is still mooncake;
# see docs/ops-provisioning.md's "Quality gate — ts-quality" section).
# ui-tools.yml clones ts-quality (github.com over https, same posture as
# go-quality) and installs web/'s npm deps; ui-ci.yml runs the full
# biome+typecheck+config-drift+build+test+supply-chain+audit+ai-lint gate.
# Previously this job only ran `npm ci && npm run build` — lint, typecheck
# and the Playwright suite never ran in CI at all.
#
# `build-images` rebuilds moongit-ci-dev:latest + moongit-agent:latest via the
# host Docker daemon (docker_socket: true mounts /var/run/docker.sock). Runs in
# parallel with deploy on main — both need quality + web to pass first.
#
# Deploy is intentionally NOT automated via CI. moongitd runs the pipeline —
# a self-deploy would interrupt the very run that triggered it. Deploy manually:
# `provision apply tasks/deploy.yml` (#410) or
# `mooncake apply -c ~/dotfiles/main_pc.yml -t moongit`.
version: "1"
on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    # Conventional-commit branch prefixes the fleet uses. Kept broad on
    # purpose: #199 makes this filter enforced (it was dead code before), so an
    # omitted prefix means that branch silently loses pre-merge CI. Add new
    # prefixes here rather than narrowing.
    branches:
      [
        main,
        "feat/*",
        "fix/*",
        "chore/*",
        "docs/*",
        "refactor/*",
        "test/*",
        "build/*",
        "ci/*",
        "perf/*",
      ]
jobs:
  quality:
    image: moongit-ci-dev:latest
    steps:
      - shell:
          cmd: mooncake task ci

  web:
    image: moongit-ci-dev:latest
    steps:
      - run: provision apply tasks/ui-tools.yml
      - run: provision apply tasks/ui-ci.yml

  # build-images:
  #   image: moongit-ci-dev:latest
  #   docker_socket: true
  #   needs: [quality, web]
  #   steps:
  #     - shell:
  #         # Clone sibling repos from the moongit server (anonymous HTTP).
  #         # --vars overrides the default host paths that tasks.yml defaults to
  #         # ("{{ home }}/projects/..."), which don't exist inside the container.
  #         cmd: |
  #           set -eu
  #           git clone --depth=1 http://host.docker.internal:8080/alehatsman/mooncake.git /tmp/mooncake
  #           printf '{"mooncake_src":"/tmp/mooncake"}' > /tmp/ci-vars.yml
  #           printf '{"mooncake_src":"/tmp/mooncake"}' > /tmp/agent-vars.yml
  #           mooncake task ci-images --vars /tmp/ci-vars.yml
  #           mooncake task agent-image --vars /tmp/agent-vars.yml
  #       env:
  #         MOONCAKE_MODULE_INSECURE: host.docker.internal:8080

  # smoke: runs in the default CI container (moongit-ci:latest) on a cron
  # schedule. Uses host.docker.internal:8080 to reach the prod moongitd from
  # inside the container (127.0.0.1 is the container's own loopback).
  # /healthz probes both process liveness AND the DB writer pool — sufficient
  # smoke coverage without needing a Bearer token in the container env.
  # Authenticated API checks require env passthrough to CI containers (TODO).
  smoke:
    image: moongit-ci:latest
    steps:
      - assert:
          http:
            url: "http://host.docker.internal:8080/healthz"
            status: 200
            contains: "ok"

      - assert:
          http:
            url: "http://host.docker.internal:8080/"
            status: 200
            contains: "<div id=\"root\""
