# dex indexing config for the web/ TS frontend, indexed as its own dex
# root so its tree-sitter graph stays separate from the Go (go/types)
# graph at the repo root. Indexing is opt-in: only paths matching an
# include pattern below are indexed. Patterns use gitignore grammar — a
# trailing slash matches a directory subtree, "*.tsx" matches at any depth.
#
# node_modules/ and dist/ are excluded by web/.gitignore + dex's built-in
# DefaultPatterns; the carve-outs below drop regenerated test artifacts.
index:
  include:
    - src/         # React/TS application source (.tsx/.ts/.css)
    - tests/       # Playwright/unit specs
    - "*.ts"       # root configs (playwright.config.ts, vite, …)
    - "*.json"     # package.json, tsconfig.json, biome.json
    - "*.md"       # web/CLAUDE.md, frontend docs
    - index.html
  ignore:
    - test-results/        # Playwright run output — regenerated
    - playwright-report/   # Playwright HTML report — regenerated noise
    - "*.tsbuildinfo"      # TS incremental build cache
