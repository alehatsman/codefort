<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>moongit</title>
    <script>
      // Apply the saved theme before first paint (no flash of default theme).
      // Mirror of theme.ts: monokai is the default; github is the base scheme,
      // rendered with no data-theme. So an unset (or non-github) preference
      // resolves to monokai. "monokai-web"/"monokai-code" are legacy ids from
      // the earlier 3-scheme selector (the latter mapped to github/base).
      try {
        var t = localStorage.getItem("moongit:theme")
        if (t !== "github" && t !== "monokai-code") {
          document.documentElement.setAttribute("data-theme", "monokai")
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
