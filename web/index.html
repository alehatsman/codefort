<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>moongit</title>
    <script>
      // Apply the saved theme before first paint (no flash of default theme).
      // Mirror of theme.ts: github is the base; monokai sets data-theme.
      // "monokai-web" is the legacy id from the earlier 3-scheme selector.
      try {
        var t = localStorage.getItem("moongit:theme")
        if (t === "monokai" || t === "monokai-web") {
          document.documentElement.setAttribute("data-theme", "monokai")
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
