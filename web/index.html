<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>moongit</title>
    <script>
      // Apply the saved color scheme before first paint (no flash of default
      // theme). Mirror of theme.ts: github is the base, others set data-theme.
      try {
        var t = localStorage.getItem("moongit:theme")
        if (t === "monokai-code" || t === "monokai-web") {
          document.documentElement.setAttribute("data-theme", t)
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
